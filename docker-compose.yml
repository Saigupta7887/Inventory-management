services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bondly
      POSTGRES_PASSWORD: bondly
      POSTGRES_DB: bondly
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bondly"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://bondly:bondly@db:5432/bondly
      SECRET_KEY: change-me-in-production
      ENVIRONMENT: development
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pgdata:
